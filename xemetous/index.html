</main><script>
'use strict';
// ---- 状態 -------------------------------------------------------------------
const W=440,H=680,KINDS=5,NASU=4;
const CELL=52;                  // 照準1マス＝文字1つ。ゼビウスの照準くらいの大きさ（前は34）
const Z=CELL/34;                // 前の大きさからの倍率（自機・敵・弾・地上の敵もこれだけ大きくする）
// 調整できる数値は CFG にまとめ、「設定」画面から変えられる（端末に残る）
const CFG_DEF=[
 {k:'shipSpeed',name:'自機の速さ',def:1.5,min:.5,max:3,step:.1,unit:'倍',note:'タッチ・マウス・キーすべての移動量にかかる'},
 {k:'touchSens',name:'タッチ感度',def:1.3,min:.5,max:3,step:.1,unit:'倍',note:'指を動かした量×これ'},
 {k:'mouseSens',name:'マウス感度',def:1.2,min:.3,max:3,step:.1,unit:'倍',note:'マウスを動かした量×これ'},
 {k:'keySpeed',name:'キー移動の速さ',def:300,min:100,max:600,step:10,unit:'px/秒',note:'矢印・WASD'},
 {k:'follow',name:'自機の追従',def:16,min:4,max:40,step:1,unit:'',note:'大きいほど操作にぴったり付いてくる'},
 {k:'sightAhead',name:'照準の距離',def:150,min:90,max:240,step:2,unit:'px',note:'自機から照準まで'},
 {k:'shotMax',name:'空中弾の数',def:3,min:1,max:8,step:1,unit:'発',note:'画面に出せる数'},
 {k:'bombT',name:'地上弾が落ちる時間',def:.55,min:.2,max:1.2,step:.05,unit:'秒',note:''},
 {k:'volume',name:'音量',def:50,min:0,max:100,step:5,unit:'%',note:'効果音・BGM・声ぜんぶの大きさ'},
 {k:'voice',name:'声',def:1,min:0,max:1,step:1,labels:['なし','あり'],note:'言葉ができた時に女の子の声で読み上げる'},
 {k:'eFire',name:'敵弾の量',def:1,min:0,max:2,step:.1,unit:'倍',note:'画面に出る敵弾の数と撃つ間隔。0で撃ってこない'},
 {k:'eSpeed',name:'敵弾の速さ',def:150,min:80,max:260,step:10,unit:'px/秒',note:''},
 {k:'scroll',name:'スクロールの速さ',def:42,min:20,max:90,step:2,unit:'px/秒',note:'地面が流れる速さ'}];
const CFG={};
let master=null;                                     // 全部の音はここを通る（設定の「音量」）
for(const d of CFG_DEF)CFG[d.k]=d.def;
try{const o=JSON.parse(localStorage.getItem('xemetous_cfg')||'{}');
 for(const d of CFG_DEF)if(typeof o[d.k]==='number'&&isFinite(o[d.k]))CFG[d.k]=Math.min(d.max,Math.max(d.min,o[d.k]))}catch(e){}
if(CFG.sightAhead===118)CFG.sightAhead=150;      // 前の初期値のままなら、大きくした照準に合わせる
let SPD,SIGHT_AHEAD,BOMB_T,SHOT_MAX,TOUCH_SENS,MOUSE_SENS;
function applyCfg(){if(master)master.gain.value=CFG.volume/100*MASTER;SPD=CFG.scroll;SIGHT_AHEAD=CFG.sightAhead;BOMB_T=CFG.bombT;SHOT_MAX=CFG.shotMax;
 TOUCH_SENS=CFG.touchSens*CFG.shipSpeed;MOUSE_SENS=CFG.mouseSens*CFG.shipSpeed}
applyCfg();
const SHOT_RATE=.11;            // 通常弾の最短の間隔
const TAP_MOVE=20;              // タッチ：これより動かさずに離したら地上弾（動かしたら移動だけ）
const LIVES=3;
const SAND={deep:'#3a2a1a',dark:'#8f6d38',base:'#c8a062',light:'#ecd196',hi:'#faeecd'};

let phase='ready',paused=false,time=0,t=0,area=1,diff=1,scroll=0,shake=0,flash=0,messageUntil=0;
let padPrev=[],padUsed=false,easy=false;            // easy：イージースタート（敵の弾の出る頻度が半分）
const FIRE=()=>easy?2.4:1;                               // 敵が撃つ間隔に掛ける                         // コントローラ（pollPad）
let score=0,lives=LIVES,power=2,aim='h',groundHeld=false,armed=false;
let ship,shots,ebul,air,ground,caps,feats,bomb,parts,booms,pops,script,si,timers=[];
let items=[],missiles=[],boss=null;   // items＝宙に浮いたパーツ、missiles＝撃ち出したパーツ、boss＝地を這うボス
const later=(d,f)=>timers.push({at:t+d,f});   // ゲーム内の時間で少し後に（一時停止中は進まない）
let touchMover=null,touchBtn=null,mouseMode=false,mouseShoot=false,keyShoot=false,keyGround=false,usedTouch=false;
const keys=new Set();
const rnd=n=>Math.floor(Math.random()*n);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const $=id=>document.getElementById(id);
const canvas=$('game'),ctx=canvas.getContext('2d');

// ---- 地上パズル -------------------------------------------------------------
// 地上物は2種類の遊び
//  そろえる … 文字の板（ことば）と地上絵の板（ピース）。照準は1マス。ボタンを押すと照準の下の1マスをつかみ、
//            動かすと、動いた先のマスと入れ替わっていく（パズドラのように）。離すか、板の外に出たら終わり。
//            終わった時に横（左→右）か縦（上→下）に言葉が読めたら、その数だけ何かが出てくる。
//            大きな板は消えた所に上から文字が落ちてきて、続けてそろうと連鎖。1回の操作でできた数が「コンボ」で、
//            出てきた物の威力はコンボ数倍。
//  けす   … 横や縦に並んだ砲台・ピラミッド。照準の範囲で一度に壊すとボーナス（地上弾）
// モード：ノーマル（いぬ・ねこ・すいか…）と うんち（うんこ・ちち・ちんちん…）。言葉と地上絵と出てくる物が変わる
const MODES={
 // 言葉は3文字から（マッチ3が基本）
 normal:{name:'ノーマルモード',words:{'こいぬ':'dog','こねこ':'cat','すいか':'suika','りんご':'ringo','さかな':'sakana','おさかな':'sakana',
   'おにぎり':'onigiri','ごりら':'gorira','きりん':'kirin','いるか':'iruka'},
  script:['こいぬ','こねこ','ごりら','おさかな'],pics:['nasu','neko'],picName:{nasu:'ナスの地上絵',neko:'こねこの絵'}},
 all:{name:'うんちありモード',words:{},script:['こいぬ','こねこ','うんこ','おちんちん'],pics:['neko','unko'],
  picName:{nasu:'ナスの地上絵',neko:'こねこの絵',unko:'うんこの地上絵'}}};
const UNCHI_WORDS={'うんこ':'unko','うんち':'unchi','ちんちん':'chin','おちんちん':'chinL','ちんこ':'chin','おちんこ':'chinL','おうち':'ouchi'};
MODES.all.words={...MODES.normal.words,...UNCHI_WORDS};
MODES.normal.name='うんちなしモード';
// うんちありモードは、前半はうんちなしと同じ言葉だけ。後半（UNCHI_T 秒から）とボス戦で うんち系がまざる。最後は巨大ナスの地上絵
const STRETCH=1;                                  // 台本の時刻をのばす倍率（板が長く残るぶん、道中も長く）
const UNCHI_T=78*STRETCH;                            // P3（2回目のパネルの時間）から
const EASY_T=UNCHI_T;                                 // ここまでの文字そろえは「1つ動かせばそろう」やさしい板
const unchiTime=()=>mode==='all'&&(t>=UNCHI_T||!!boss);
let mode='all';   // パイロット版は うんちありモードだけ（うんちなしモードは MODES.normal に残してある）
let WORD_PART,WORDS,LETTER_POOL,PICS,EARLY_WORDS,EARLY_POOL;
const genWords=()=>mode==='all'&&!unchiTime()?EARLY_WORDS:WORDS,pickWord=()=>{const L=genWords();return L[rnd(L.length)]};
function setMode(m){mode=m;const M=MODES[m];WORD_PART=M.words;PICS=M.picName;
 WORDS=Object.keys(WORD_PART).sort((a,b)=>b.length-a.length);   // 長い言葉を優先
 LETTER_POOL=WORDS.join('');                                    // 言葉に出てくる文字を、出てくる回数の割合で
 EARLY_WORDS=WORDS.filter(w=>!UNCHI_WORDS[w]);EARLY_POOL=EARLY_WORDS.join('');
 try{localStorage.setItem('xemetous_mode',m)}catch(e){}}
setMode(mode);
const LETTER_COL={'う':'#fff6dc','ん':'#f6e27a','こ':'#e8a060','ち':'#a8e07a','お':'#ffb0c8'};
const letterCol=ch=>ch==null?'#f2d9a4':LETTER_COL[ch]||['#fff6dc','#f6e27a','#e8a060','#a8e07a','#ffb0c8','#a8d8ff'][ch.charCodeAt(0)%6];
function wordsFound(o){                       // 読める言葉（重なる時は長い方を優先）
 const cand=[],{w,h,cells}=o;
 const scan=(get,n,mk)=>{let s='';for(let i=0;i<n;i++)s+=get(i)||' ';
  for(const wd of WORDS){let k=s.indexOf(wd);while(k>=0){const cs=[];for(let i=0;i<wd.length;i++)cs.push(mk(k+i));cand.push({word:wd,cs});k=s.indexOf(wd,k+1)}}};
 for(let r=0;r<h;r++)scan(i=>cells[r][i],w,i=>[r,i]);
 for(let c=0;c<w;c++)scan(i=>cells[i][c],h,i=>[i,c]);
 cand.sort((a,b)=>b.word.length-a.word.length);
 const used=new Set(),out=[];
 for(const f of cand){if(f.cs.some(([r,c])=>used.has(r*w+c)))continue;f.cs.forEach(([r,c])=>used.add(r*w+c));out.push(f)}
 return out}
function swapCells(cells,a,b){const t=cells[a[0]][a[1]];cells[a[0]][a[1]]=cells[b[0]][b[1]];cells[b[0]][b[1]]=t}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const randLetter=()=>{const P=mode==='all'&&!unchiTime()?EARLY_POOL:LETTER_POOL;return P[rnd(P.length)]};
const artCache={};
function pieceHasArt(pic,w,h,id){                     // そのピースに絵（線）が描いてあるか。無地のピースは入れかえても見分けがつかない
 const A=artOf(pic);if(!A)return true;
 const key=pic+w+'x'+h;if(!artCache[key]){const g=A.getContext('2d'),m=[];
  for(let i=0;i<w*h;i++){const d=g.getImageData((i%w)*CELL,Math.floor(i/w)*CELL,CELL,CELL).data;let n=0;for(let j=3;j<d.length;j+=16)if(d[j]>60)n++;m.push(n>12)}
  artCache[key]=m}
 return artCache[key][id]}
function wordForLen(n){                              // n マスの板に入れる言葉：n 文字の言葉があれば それ、なければ1つ短い言葉＋1文字（5マスなら 4〜5文字の強い言葉）
 const pool=genWords(),by=k=>pool.filter(w=>w.length===k);
 let c=by(n);if(n>=5&&(!c.length||Math.random()<.4))c=c.concat(by(4));
 if(!c.length)c=by(n-1);if(!c.length)c=pool;
 const word=c[rnd(c.length)];return{word,extra:Math.max(0,n-word.length)}}
function makePuzzle(x,y,type='word',arg){
 let w,h,cells,o;
 const easy=type!=='legend'&&!boss&&t<EASY_T;
 const spec=arg&&typeof arg==='object'&&arg.n?wordForLen(arg.n):null;   // 壊した地上物の数 ＝ マスの数
 if(type==='word'&&easy){                     // 前半：1列。となりを1回入れ替えればそろう
  const word=spec?spec.word:pickWord(),dir=Math.random()<.5?'h':'v';let L;
  for(let k=0;k<200;k++){L=[...word];
   if(spec)for(let e=0;e<spec.extra;e++)L[Math.random()<.5?'push':'unshift'](randLetter());
   else if(word.length<5&&Math.random()<.4)L[Math.random()<.5?'push':'unshift'](randLetter());
   const off=L.indexOf(word[0])>=0&&L.join('').indexOf(word)>=0?L.join('').indexOf(word):0,i=off+rnd(word.length-1);
   [L[i],L[i+1]]=[L[i+1],L[i]];
   const q={w:dir==='h'?L.length:1,h:dir==='h'?1:L.length,cells:dir==='h'?[L.slice()]:L.map(c=>[c])};
   if(!wordsFound(q).length)break}
  w=dir==='h'?L.length:1;h=dir==='h'?1:L.length;cells=dir==='h'?[L.slice()]:L.map(c=>[c]);o={type:'word',word}}
 else if(type==='grid'){                      // 5×3：1枚を縦にすべらせる（つかんで2マス動かす）だけで、2〜3語が同時にそろう並び
  w=5;h=3;let ok=false;
  for(let k=0;k<600&&!ok;k++){cells=Array.from({length:h},()=>Array.from({length:w},randLetter));
   const c=rnd(w),n=Math.random()<.6?3:2,r0=n===3?0:rnd(2),rows=[];
   for(let r=r0;r<r0+n;r++){const wd=pickWord();if(wd.length>w){rows.length=0;break}
    const lo=Math.max(0,c-wd.length+1),hi=Math.min(c,w-wd.length),s0=lo+rnd(hi-lo+1);

const canFullscreen=!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen);
const isStandalone=window.matchMedia('(display-mode: fullscreen)').matches||
 window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||
 (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function inFullscreen(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
function enterFullscreen(){
 const el=document.documentElement,r=el.requestFullscreen||el.webkitRequestFullscreen;
 if(!r)return Promise.resolve(false);
 try{return Promise.resolve(r.call(el,{navigationUI:'hide'})).then(()=>true).catch(()=>false)}
 catch(e){return Promise.resolve(false)}}
function leaveFullscreen(){const x=document.exitFullscreen||document.webkitExitFullscreen;
 if(x)try{x.call(document)}catch(e){}}
function lockPortrait(){try{const o=screen.orientation;
 if(o&&o.lock)o.lock('portrait').catch(()=>{})}catch(e){}}
let wakeLock=null;
function keepAwake(){if(!('wakeLock'in navigator)||wakeLock)return;
 navigator.wakeLock.request('screen').then(w=>{wakeLock=w;
  w.addEventListener('release',()=>{wakeLock=null})}).catch(()=>{})}
function syncFullBtn(){const b=$('full');if(!b)return;
 if(isStandalone){b.classList.add('hidden');return}
 if(!canFullscreen){b.classList.toggle('hidden',isIOS);return}
 b.textContent=inFullscreen()?'解除':'全画面'}
function goFullscreen(){if(isStandalone)return;
 enterFullscreen().then(ok=>{if(ok)lockPortrait();syncFullBtn()})}

function resize(){const st=$('stage'),sw=st.clientWidth,sh=st.clientHeight;
 const k=Math.max(.1,Math.min(sw/W,sh/H));
 canvas.style.width=Math.floor(W*k)+'px';canvas.style.height=Math.floor(H*k)+'px';
 const d=Math.max(1,Math.min(3,k*(devicePixelRatio||1)));canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);
 ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);ctx.imageSmoothingEnabled=false}
window.addEventListener('resize',resize);

// ---- コントローラ（どのゲームでも最初から対応）：スティック/十字＝移動、A・B・X・Y＝地上弾/つかむ/はなす（3回連打＝撃ち出す）、START＝一時停止
function pollPad(dt){
 const gps=navigator.getGamepads?navigator.getGamepads():[];let gp=null;for(const g of gps)if(g&&g.connected){gp=g;break}
 if(!gp)return;
 const b=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed),down=i=>b(i)&&!padPrev[i];
 let x=gp.axes[0]||0,y=gp.axes[1]||0;if(Math.hypot(x,y)<.25){x=0;y=0}
 if(b(14))x=-1;if(b(15))x=1;if(b(12))y=-1;if(b(13))y=1;
 const ov=!$('overlay').classList.contains('hidden'),cfgOpen=!$('cfg').classList.contains('hidden');
 if(cfgOpen){if(down(1)||down(9))closeCfg()}
 else if(ov){if(down(0)||down(9)){audio();if($('start'))$('start').click()}else if(down(1)&&$('ov1'))$('ov1').click()}
 else if(phase==='play'){
  if(down(9)){togglePause('START ボタン')}
  else if(!paused){
   if(x||y){const v=CFG.keySpeed*CFG.shipSpeed*dt;ship.tx=clamp(ship.tx+x*v,24,W-24);ship.ty=clamp(ship.ty+y*v,SIGHT_AHEAD+40,H-30);padUsed=true;mouseMode=false}
   for(const i of [0,1,2,3]){if(down(i)){padUsed=true;mouseMode=false;audio();groundDown('p'+i,'h')}else if(padPrev[i]&&!b(i))groundUp('p'+i)}}}
 padPrev=gp.buttons.map(q=>q.pressed)}

function frame(now){const dt=Math.min((now-last)/1000,.04);last=now;
 try{pollPad(dt);if(phase==='play'&&!paused)update(dt);else if(phase==='ending')updateEnding(dt);else scroll+=dt*SPD*.5;
  draw()}catch(e){console.error(e)}                  // 1つの不具合で画面が止まらないように
 requestAnimationFrame(frame)}
