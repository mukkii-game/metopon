<!doctype html><html><head><meta charset="utf-8">
<!-- タイトルロゴ。ブラウザ（Playwright）で #logo を撮って assets/img/logo_nasu.png にする（tools/make_logo.py）。
     文字は大きく、ナスの地上絵は文字に重ねず、その下に置く -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&display=block">
<style>
body{margin:0;background:transparent}
#logo{position:relative;width:560px;height:340px;overflow:hidden;border-radius:10px;
 background:url(../assets/img/sand.png) repeat;background-size:128px;
 box-shadow:inset 0 0 60px #3a2a1aee,inset 0 0 0 6px #3a2a1a}
#logo:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,#fff3d000,#3a2a1a88)}
h1{position:absolute;left:0;right:0;text-align:center;top:18px;margin:0;font-family:'Dela Gothic One';font-weight:400;font-size:86px;letter-spacing:1px;
 color:#f6e7c1;white-space:nowrap;
 text-shadow:0 2px 0 #fff8e4,0 -3px 0 #5a3e1e,3px 0 0 #5a3e1e,-3px 0 0 #5a3e1e,0 7px 0 #3a2a1a,5px 11px 0 #00000055}
h1 span{font-size:60px}
svg{position:absolute;left:225px;top:142px;width:110px;height:110px}
p{position:absolute;left:0;right:0;text-align:center;top:252px;margin:0;font-family:'DotGothic16';font-size:24px;letter-spacing:8px;color:#fff3d6;
 text-shadow:2px 2px 0 #3a2a1a,-1px -1px 0 #3a2a1a}
small{position:absolute;left:0;right:0;text-align:center;top:290px;font-family:'DotGothic16';font-size:16px;letter-spacing:3px;color:#fff3d6;text-shadow:1px 1px 0 #3a2a1a}
</style></head><body>
<div id="logo">
<h1>ナス<span>の</span>地上絵</h1>
<svg viewBox="0 0 100 100"><g fill="none" stroke-linecap="round" stroke-linejoin="round">
<g stroke="#3a2a1a" stroke-width="7"><ellipse cx="57" cy="60" rx="25" ry="34" transform="rotate(-36 57 60)"/>
<path d="M20 12 L34 30 M22 36 L34 30 L30 46 M34 30 L50 26 M34 30 L46 40"/><path d="M38 70 Q44 82 58 86"/></g>
<g stroke="#fff3d6" stroke-width="3.4"><ellipse cx="57" cy="60" rx="25" ry="34" transform="rotate(-36 57 60)"/>
<path d="M20 12 L34 30 M22 36 L34 30 L30 46 M34 30 L50 26 M34 30 L46 40"/><path d="M38 70 Q44 82 58 86"/></g></g></svg>
<p>NASU NO CHIJOE</p>
<small>— もじをつかんで、そろえて、うちこめ —</small>
</div></body></html>
