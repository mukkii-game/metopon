<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>METOPON — 撃って集めて、そろえて消す</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08131e;color:#ecf8ee;font-family:system-ui,sans-serif;overscroll-behavior:none}main{max-width:480px;margin:auto;height:100dvh;display:flex;flex-direction:column;padding:8px 12px max(8px,env(safe-area-inset-bottom));gap:6px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:20px;letter-spacing:3px;margin:0}small{font-size:10px;color:#96b7bf}button{font:inherit;color:inherit;background:#18313d;border:1px solid #42616b;border-radius:12px;padding:8px;touch-action:none}button:active,.held{background:#436878!important}#top{display:flex;gap:5px}#top button{font-size:12px}#status{font-size:12px;display:flex;justify-content:space-between;min-height:18px}#stage{position:relative;flex:1;min-height:160px;overflow:hidden;border-radius:16px;border:1px solid #35525c;background:#0a242b}canvas{width:100%;height:100%;display:block;touch-action:none}#overlay{position:absolute;inset:0;background:#071725eF;display:flex;align-items:center;justify-content:center;padding:22px;text-align:center}#overlay h2{font-size:26px;margin:12px 0}#overlay p{font-size:14px;line-height:1.8;color:#bbd0d0}#overlay button{background:#acdc69;color:#102517;font-weight:bold;padding:14px 28px}#hint{font-size:12px;min-height:32px;color:#bfd4cf;text-align:center}#controls{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;height:83px}#pad{background:radial-gradient(circle,#274a58,#142b38);border:1px solid #44636c;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;touch-action:none;font-size:13px;color:#c5d5d8;user-select:none}#fire{background:#193f56}#bomb{background:#483b65}#controls button b{font-size:23px;display:block}#controls button span{font-size:11px}#options{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#9ab6bd;gap:5px}#options button{font-size:11px;padding:5px 8px}.hidden{display:none!important}
</style></head><body><main>
<header><div><h1>METOPON</h1><small>AIR × EARTH / PLAYABLE STUDY 03</small></div><div id="top"><button id="sound">音 ON</button><button id="pause">一時停止</button></div></header>
<div id="status"><span id="score">SCORE 0</span><span id="progress">消去 0</span><span id="life">回避なし</span></div>
<div id="stage"><canvas id="game"></canvas><div id="overlay"><div><small>3個の直線・2×2・3×3</small><h2>同じものを、<br>大きくそろえる。</h2><p>左パッドで自機を動かす。<br>Aを押し続けて空中の敵を撃つ。<br>Bで照準内の地上ピースを左右交換。<br>同じ色・記号を直線や正方形に。<br>光っている間も交換・配置で大きくできます。</p><p>敵は攻撃してきません。<br>撃破した形が右のNEXTにストック。<br>「交換／配置」を切り替えてBで実行。</p><button id="start">試作をあそぶ</button></div></div></div>
<div id="hint">空中で集める → 地上でそろえる → 連鎖で大きく消す</div>
<div id="controls"><div id="pad">↕ ↔<br>移動パッド</div><button id="fire"><b>A</b><span>押し続けて連射</span></button><button id="bomb"><b>B</b><span id="bLabel">左右交換</span></button></div>
<div id="options"><button id="mode">B：交換</button><span>3直線 / 2×2 / 3×3</span><button id="reset">最初から</button></div>
</main><script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');
const W=508,FIELD=420,H=620,COLS=7,ROWS=7,S=48,GX=42,GY=94;
const colors=['#bf9bf9','#8edda8','#ffc778','#7acbfa'];
let board,ship,enemies,shots,drops,particles,score,ink,phase='ready',time=0,spawn=0,fireCD=0,bombCD=0,chain=0,chainUntil=0,cleared=0,pending=null,moveCD=0,sound=true,ac,mode='swap',shake=0;
const keys=new Set(),firePointers=new Set();let drag=null,padDrag=null,fireKey=false;
function tone(f=440,d=.07,type='sine',v=.035){if(!sound||!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}
function audio(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();ac.resume().catch(()=>{});}
function rnd(n){return Math.floor(Math.random()*n)}
function matches(b=board){const found=new Set();for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const k=b[r][c];if(k<0)continue;if(c+2<COLS&&b[r][c+1]===k&&b[r][c+2]===k){found.add(r*COLS+c);found.add(r*COLS+c+1);found.add(r*COLS+c+2)}if(r+2<ROWS&&b[r+1][c]===k&&b[r+2][c]===k){found.add(r*COLS+c);found.add((r+1)*COLS+c);found.add((r+2)*COLS+c)}}for(let r=0;r<ROWS-1;r++)for(let c=0;c<COLS-1;c++){const k=b[r][c];if(k>=0&&b[r][c+1]===k&&b[r+1][c]===k&&b[r+1][c+1]===k){for(let y=0;y<2;y++)for(let x=0;x<2;x++)found.add((r+y)*COLS+c+x)}}return found}
function bestSquare(){let best=1;for(const n of [2,3])for(let r=0;r<=ROWS-n;r++)for(let c=0;c<=COLS-n;c++){const k=board[r][c];let ok=k>=0;for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(board[r+y][c+x]!==k)ok=false;if(ok)best=n}return best}
function newBoard(){board=Array.from({length:ROWS},()=>Array.from({length:COLS},()=>rnd(4)));for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){while((c>1&&board[r][c]===board[r][c-1]&&board[r][c]===board[r][c-2])||(r>1&&board[r][c]===board[r-1][c]&&board[r][c]===board[r-2][c]))board[r][c]=(board[r][c]+1)%4;if(r>0&&c>0&&board[r][c]===board[r-1][c]&&board[r][c]===board[r][c-1]&&board[r][c]===board[r-1][c-1])board[r][c]=(board[r][c]+1)%4;}board[4][1]=0;board[4][2]=0;board[4][3]=1;board[4][4]=0;}
function reset(){newBoard();ship={x:210,y:460};enemies=[];shots=[];drops=[];particles=[];score=0;ink=[];time=0;spawn=1;fireCD=0;bombCD=0;chain=0;chainUntil=0;cleared=0;pending=null;moveCD=0;mode='swap';shake=0;clearInput();ui();}
function clearInput(){keys.clear();firePointers.clear();fireKey=false;padDrag=null;drag=null;$('fire').classList.remove('held')}
function footprint(){return mode==='place'?(ink[0]||{w:1,h:1}):{w:2,h:1}}
function target(){const p=footprint();return {c:Math.max(0,Math.min(COLS-p.w,Math.round((ship.x-GX-S/2)/S))),r:Math.max(0,Math.min(ROWS-p.h,Math.round((ship.y-150-GY-S/2)/S)))}}
function burst(x,y,col,n=12){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,life:.4+Math.random()*.4,col})}
function ui(){$('score').textContent='SCORE '+score;$('progress').textContent='消去 '+cleared;$('life').textContent='回避なし';$('mode').textContent=mode==='swap'?'B：交換':'B：素材を置く';$('bLabel').textContent=mode==='swap'?'照準の2マスを交換':ink.length?'配置 '+ink[0].w+'×'+ink[0].h+' ／残'+ink.length:'素材なし（Aで獲得）';}
let messageUntil=0;function message(s,secs=3){$('hint').textContent=s;messageUntil=time+secs}
function resolve(){const hit=matches();if(!hit.size){pending=null;return false}const square=bestSquare();if(!pending){pending={hit,until:time+2.4,square};message('成立！ 消えるまで2.4秒。交換・配置で大きくしよう',2.4)}else{pending.hit=hit;pending.square=square}return true}
function clearPending(){if(!pending)return;const {hit,square}=pending;pending=null;chain=time<chainUntil?chain+1:1;chainUntil=time+3.2;const bonus=square===3?900:square===2?160:0;const gain=(hit.size*30+bonus)*chain;score+=gain;cleared+=hit.size;for(const id of hit){const r=Math.floor(id/COLS),c=id%COLS;burst(GX+c*S+24,GY+r*S+24,colors[board[r][c]],12);board[r][c]=-1}
for(let c=0;c<COLS;c++){const remain=board.map(r=>r[c]).filter(v=>v>=0);while(remain.length<ROWS)remain.unshift(rnd(4));for(let r=0;r<ROWS;r++)board[r][c]=remain[r]}
shake=square===3?10:square===2?5:2;tone(220*Math.pow(1.25,Math.min(chain,7)),.2,'triangle');resolve();message((square>1?square+'×'+square:'3個の直線')+'！ '+chain+' CHAIN +'+gain,2);ui()}
function moveShip(dx,dy){ship.x=Math.max(GX+24,Math.min(GX+24+6*S,ship.x+dx*S));ship.y=Math.max(GY+24+150,Math.min(GY+24+150+6*S,ship.y+dy*S))}
function bomb(){if(phase!=='play'||bombCD>0)return;const {r,c}=target();if(mode==='place'){if(!ink.length){message('Aで空中の敵を倒すと、右のNEXTにピースが入ります');return}const p=ink.shift();for(let y=0;y<p.h;y++)for(let x=0;x<p.w;x++)board[r+y][c+x]=p.k}else{[board[r][c],board[r][c+1]]=[board[r][c+1],board[r][c]]}bombCD=.2;tone(330,.09,'triangle');burst(GX+c*S+24,GY+r*S+24,'#ffffff',6);if(!resolve())message(mode==='swap'?'交換しました。同じ色・形を縦横3つそろえる':'素材を配置しました');ui();}
function kill(e){if(e.dead)return;e.dead=true;score+=100*e.w*e.h;burst(e.x,e.y,colors[e.k],12*e.w*e.h);ink.push({w:e.w,h:e.h,k:e.k});message(e.w+'×'+e.h+'ピース獲得！ NEXT先頭からBで配置');tone(100,.08,'square');ui()}
function makeEnemy(w,h,x,y,k=rnd(4)){return {w,h,x,y,k,hp:w*h+1,maxHp:w*h+1,age:0,t:Math.random()*6}}
function spawnWave(){[[1,1,76],[2,1,198],[2,2,326]].forEach(([w,h,x],i)=>enemies.push(makeEnemy(w,h,x,-45-i*52)));}
function update(dt){time+=dt;spawn-=dt;fireCD-=dt;bombCD-=dt;shake=Math.max(0,shake-dt*25);
let dx=(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0),dy=(keys.has('ArrowDown')||keys.has('s')?1:0)-(keys.has('ArrowUp')||keys.has('w')?1:0);
if(padDrag){dx=Math.abs(padDrag.dx)>.3?Math.sign(padDrag.dx):0;dy=Math.abs(padDrag.dy)>.3?Math.sign(padDrag.dy):0}moveCD-=dt;if(dx||dy){if(moveCD<=0){moveShip(dx,dy);moveCD=.14}}else moveCD=0;if(pending&&time>=pending.until)clearPending();
if((firePointers.size||fireKey)&&fireCD<=0){shots.push({x:ship.x,y:ship.y-20});fireCD=.12;tone(620,.035,'triangle',.016)}
if(spawn<=0){spawnWave();spawn=5.5}
for(const s of shots){const prev=s.y;s.y-=620*dt;for(const e of enemies)if(!e.dead&&Math.abs(s.x-e.x)<e.w*19&&s.y<=e.y+e.h*19&&prev>=e.y-e.h*19){s.y=-999;if(--e.hp<=0)kill(e);else burst(s.x,e.y,colors[e.k],3);break}}shots=shots.filter(s=>s.y>-30);
for(const e of enemies){e.age+=dt;if(e.age>=.55){e.age-=.55;e.step=(e.step||0)+1;if(e.step%3===0){e.x=Math.max(66,Math.min(354,e.x+(e.step%6===0?-48:48)))}else e.y+=24}}enemies=enemies.filter(e=>!e.dead&&e.y<H+50);
for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt}particles=particles.filter(p=>p.life>0);
if(time>messageUntil){$('hint').textContent=time<chainUntil?'連鎖チャンス '+(chainUntil-time).toFixed(1)+'秒':'同じ色・記号を3直線／2×2／3×3にそろえよう。'}
}
function symbol(k,x,y,size=8){ctx.beginPath();if(k===0){ctx.moveTo(x,y-size);ctx.lineTo(x+size,y);ctx.lineTo(x,y+size);ctx.lineTo(x-size,y)}else if(k===1){ctx.arc(x,y,size,0,Math.PI*2)}else if(k===2){ctx.moveTo(x,y-size);ctx.lineTo(x+size,y+size);ctx.lineTo(x-size,y+size)}else{ctx.rect(x-size,y-size,size*2,size*2)}ctx.closePath();ctx.fill()}
function draw(){ctx.clearRect(0,0,W,H);ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);ctx.fillStyle='#0b262e';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#183941';ctx.lineWidth=1;for(let y=-40;y<H;y+=42){ctx.beginPath();ctx.moveTo(0,y+(time*10)%42);ctx.lineTo(W,y+(time*10)%42);ctx.stroke()}
ctx.font='11px system-ui';ctx.fillStyle='#70968e';ctx.fillText('GROUND / 3直線・2×2・3×3',GX,76);ctx.fillText('AIR / 編隊を撃って素材を回収',GX,26);
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const x=GX+c*S,y=GY+r*S,k=board[r][c],lit=pending?.hit.has(r*COLS+c);ctx.fillStyle=lit?'#536653':'#122f38';ctx.fillRect(x+1,y+1,S-2,S-2);if(lit){ctx.strokeStyle='#efffb7';ctx.lineWidth=2;ctx.strokeRect(x+3,y+3,S-6,S-6)}ctx.fillStyle=colors[k];symbol(k,x+24,y+24,lit?13+Math.sin(time*12)*2:10)}
const {r,c}=target(),tx=GX+c*S,ty=GY+r*S;ctx.strokeStyle='#f6f5b4';ctx.lineWidth=3;const fp=footprint();ctx.strokeRect(tx+2,ty+2,S*fp.w-4,S*fp.h-4);if(mode==='place'&&ink.length){ctx.globalAlpha=.55;ctx.fillStyle=colors[ink[0].k];for(let yy=0;yy<fp.h;yy++)for(let xx=0;xx<fp.w;xx++)symbol(ink[0].k,tx+xx*S+24,ty+yy*S+24,17);ctx.globalAlpha=1;}ctx.setLineDash([3,7]);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(ship.x,ship.y);ctx.lineTo(tx+24,ty+24);ctx.stroke();ctx.setLineDash([]);
for(const s of shots){ctx.fillStyle='#e9ffb3';ctx.shadowColor='#bbff6b';ctx.shadowBlur=8;ctx.fillRect(s.x-2,s.y-12,4,17);ctx.shadowBlur=0}
for(const e of enemies){ctx.save();ctx.translate(e.x-e.w*19,e.y-e.h*19);for(let y=0;y<e.h;y++)for(let x=0;x<e.w;x++){ctx.fillStyle='#07131d';ctx.fillRect(x*38+4,y*38+7,36,36);ctx.fillStyle=colors[e.k];ctx.fillRect(x*38+1,y*38+1,34,34);ctx.fillStyle='#192e3b';symbol(e.k,x*38+18,y*38+18,8)}ctx.fillStyle='#efffd6';ctx.fillRect(0,-7,e.w*38*e.hp/e.maxHp,3);ctx.restore()}
ctx.save();ctx.translate(ship.x,ship.y);ctx.globalAlpha=1;ctx.fillStyle='#090f24';ctx.beginPath();ctx.ellipse(8,20,24,10,0,0,7);ctx.fill();ctx.fillStyle='#f5f4d8';ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(19,17);ctx.lineTo(0,8);ctx.lineTo(-19,17);ctx.closePath();ctx.fill();ctx.fillStyle='#66d4e3';ctx.fillRect(-4,-5,8,16);ctx.fillStyle='#e8b677';ctx.fillRect(-3,16,6,8+Math.random()*8);ctx.restore();
for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.col;ctx.fillRect(p.x-2,p.y-2,4,4)}ctx.globalAlpha=1;
if(pending){ctx.fillStyle='#f4e99f';ctx.fillRect(GX,446,COLS*S*Math.max(0,pending.until-time)/2.4,5);ctx.font='13px system-ui';ctx.fillText('消去まで '+Math.max(0,pending.until-time).toFixed(1)+'秒 / まだ大きくできる',GX,475)}else if(time<chainUntil){ctx.fillStyle='#bce7a0';ctx.fillRect(GX,446,(COLS*S)*(chainUntil-time)/3.2,3)}ctx.restore();drawNext()}
function drawNext(){ctx.fillStyle='#0a1421';ctx.fillRect(FIELD,0,W-FIELD,H);ctx.strokeStyle='#496075';ctx.beginPath();ctx.moveTo(FIELD,0);ctx.lineTo(FIELD,H);ctx.stroke();ctx.textAlign='center';ctx.font='bold 14px system-ui';ctx.fillStyle='#edf5d1';ctx.fillText('NEXT',464,28);ctx.font='11px system-ui';ctx.fillText('ストック '+ink.length,464,47);if(!ink.length){ctx.fillStyle='#99aebd';ctx.fillText('Aで撃破',464,90);ctx.fillText('して獲得',464,109)}ink.slice(0,6).forEach((p,i)=>{const y=64+i*82;ctx.strokeStyle=i===0?'#f7f3af':'#314558';ctx.lineWidth=i===0?2:1;ctx.strokeRect(430,y,68,75);ctx.fillStyle='#bdd0d4';ctx.font='10px system-ui';ctx.fillText(i===0?'次に置く':String(i+1),464,y+13);const size=20,x=464-p.w*size/2;for(let r=0;r<p.h;r++)for(let c=0;c<p.w;c++){ctx.fillStyle=colors[p.k];ctx.fillRect(x+c*size,y+21+r*size,size-2,size-2);ctx.fillStyle='#172536';symbol(p.k,x+c*size+9,y+30+r*size,5)}});if(ink.length>6){ctx.fillStyle='#adc3d1';ctx.fillText('ほか '+(ink.length-6)+'個',464,580)}ctx.textAlign='left'}
function point(e){const b=canvas.getBoundingClientRect();return{x:(e.clientX-b.left)/b.width*W,y:(e.clientY-b.top)/b.height*H}}
canvas.addEventListener('pointerdown',e=>{if(phase!=='play'||drag||point(e).x>=FIELD)return;canvas.setPointerCapture(e.pointerId);drag={id:e.pointerId,p:point(e)}});canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const p=point(e);const dx=p.x-drag.p.x,dy=p.y-drag.p.y;if(Math.abs(dx)>=S*.6||Math.abs(dy)>=S*.6){moveShip(Math.abs(dx)>=S*.6?Math.sign(dx):0,Math.abs(dy)>=S*.6?Math.sign(dy):0);drag.p=p}});
for(const ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,e=>{if(drag?.id===e.pointerId)drag=null});
$('pad').addEventListener('pointerdown',e=>{if(phase!=='play'||padDrag)return;$('pad').setPointerCapture(e.pointerId);padDrag={id:e.pointerId,x:e.clientX,y:e.clientY,dx:0,dy:0}});$('pad').addEventListener('pointermove',e=>{if(padDrag?.id!==e.pointerId)return;padDrag.dx=Math.max(-1,Math.min(1,(e.clientX-padDrag.x)/35));padDrag.dy=Math.max(-1,Math.min(1,(e.clientY-padDrag.y)/35))});for(const ev of ['pointerup','pointercancel','lostpointercapture'])$('pad').addEventListener(ev,e=>{if(padDrag?.id===e.pointerId)padDrag=null});
$('fire').addEventListener('pointerdown',e=>{if(phase!=='play')return;audio();$('fire').setPointerCapture(e.pointerId);firePointers.add(e.pointerId);$('fire').classList.add('held')});for(const ev of ['pointerup','pointercancel','lostpointercapture'])$('fire').addEventListener(ev,e=>{firePointers.delete(e.pointerId);if(!firePointers.size)$('fire').classList.remove('held')});$('bomb').addEventListener('pointerdown',e=>{e.preventDefault();audio();bomb()});
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','z','x'].includes(e.key))e.preventDefault();keys.add(e.key);if(e.key===' '||e.key==='z')fireKey=true;if(e.key==='x'&&!e.repeat)bomb()});window.addEventListener('keyup',e=>{keys.delete(e.key);if(e.key===' '||e.key==='z')fireKey=false});
function togglePause(){if(phase==='play'){phase='pause';clearInput();$('pause').textContent='再開';message('一時停止中')}else if(phase==='pause'){phase='play';$('pause').textContent='一時停止'}}
window.addEventListener('blur',()=>{clearInput();if(phase==='play')togglePause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&phase==='play')togglePause()});
function restart(){audio();reset();phase='play';$('overlay').classList.add('hidden');$('pause').textContent='一時停止';message('自機はマス移動。Bで交換し、同じ色・記号をそろえよう。',5)}
$('start').onclick=restart;$('reset').onclick=restart;$('pause').onclick=togglePause;$('sound').onclick=()=>{sound=!sound;$('sound').textContent='音 '+(sound?'ON':'OFF');if(sound)audio()};$('mode').onclick=()=>{mode=mode==='swap'?'place':'swap';ui()};
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0)}window.addEventListener('resize',resize);resize();reset();let last=performance.now();function frame(now){const dt=Math.min((now-last)/1000,.04);last=now;if(phase==='play')update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
