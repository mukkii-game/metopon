<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>METOPON — 地上絵を撃ち起こせ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08131e;color:#ecf8ee;font-family:system-ui,sans-serif;overscroll-behavior:none}main{max-width:480px;margin:auto;height:100dvh;display:flex;flex-direction:column;padding:8px 12px max(8px,env(safe-area-inset-bottom));gap:6px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:20px;letter-spacing:3px;margin:0}small{font-size:10px;color:#96b7bf}button{font:inherit;color:inherit;background:#18313d;border:1px solid #42616b;border-radius:12px;padding:8px;touch-action:none}button:active,.held{background:#436878!important}#top{display:flex;gap:5px}#top button{font-size:12px}#status{font-size:12px;display:flex;justify-content:space-between;min-height:18px}#stage{position:relative;flex:1;min-height:160px;overflow:hidden;border-radius:16px;border:1px solid #35525c;background:#0a242b}canvas{width:100%;height:100%;display:block;touch-action:none}#overlay{position:absolute;inset:0;background:#071725eF;display:flex;align-items:center;justify-content:center;padding:22px;text-align:center}#overlay h2{font-size:26px;margin:12px 0}#overlay p{font-size:14px;line-height:1.8;color:#bbd0d0}#overlay button{background:#acdc69;color:#102517;font-weight:bold;padding:14px 28px}#hint{font-size:12px;min-height:32px;color:#bfd4cf;text-align:center}#controls{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;height:83px}#pad{background:radial-gradient(circle,#274a58,#142b38);border:1px solid #44636c;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;touch-action:none;font-size:13px;color:#c5d5d8;user-select:none}#fire{background:#193f56}#bomb{background:#483b65}#controls button b{font-size:23px;display:block}#controls button span{font-size:11px}#options{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#9ab6bd;gap:5px}#options button{font-size:11px;padding:5px 8px}.hidden{display:none!important}
</style></head><body><main>
<header><div><h1>METOPON</h1><small>AIR × EARTH / PLAYABLE STUDY 01</small></div><div id="top"><button id="sound">音 ON</button><button id="pause">一時停止</button></div></header>
<div id="status"><span id="score">SCORE 0</span><span id="progress">ナス 0 / 18</span><span id="life">♥ ♥ ♥</span></div>
<div id="stage"><canvas id="game"></canvas><div id="overlay"><div><small>地上絵を、撃ち起こせ。</small><h2>描いたナスが<br>空へ飛び出す。</h2><p>左パッドで自機を動かす。<br>Aを押し続けて空中の敵を撃つ。<br>Bで照準内の地上ピースを左右交換。<br>同じ色・形を3つそろえて、ナスを描こう。</p><p>敵から落ちた素材を拾うと、<br>Bで素材を置ける。完成すると巨大ナス召喚！</p><button id="start">試作をあそぶ</button></div></div></div>
<div id="hint">空中で集める → 地上でそろえる → ナスを召喚</div>
<div id="controls"><div id="pad">↕ ↔<br>移動パッド</div><button id="fire"><b>A</b><span>押し続けて連射</span></button><button id="bomb"><b>B</b><span id="bLabel">左右交換</span></button></div>
<div id="options"><button id="mode">B：交換</button><button id="demo">召喚を見てみる</button><button id="reset">最初から</button></div>
</main><script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');
const W=420,H=620,COLS=7,ROWS=7,S=48,GX=42,GY=94;
const colors=['#bf9bf9','#8edda8','#ffc778','#7acbfa'];
// A recognizable eggplant silhouette, rather than an abstract circuit.
const mask=['0001100','0001000','0011100','0111100','0111100','0111000','0010000'].map(r=>[...r].map(Number));
const total=mask.flat().filter(Boolean).length;
let board,paint,ship,enemies,shots,drops,particles,score,hp,ink,phase='ready',time=0,spawn=0,fireCD=0,bombCD=0,chain=0,chainUntil=0,summon=0,invuln=0,winCount=0,enemyShots=[],sound=true,ac,mode='swap',shake=0;
const keys=new Set(),firePointers=new Set();let drag=null,padDrag=null,fireKey=false;
function tone(f=440,d=.07,type='sine',v=.035){if(!sound||!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}
function audio(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();ac.resume().catch(()=>{});}
function rnd(n){return Math.floor(Math.random()*n)}
function matches(b=board){const found=new Set();for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const k=b[r][c];if(k<0)continue;if(c+2<COLS&&b[r][c+1]===k&&b[r][c+2]===k){found.add(r*COLS+c);found.add(r*COLS+c+1);found.add(r*COLS+c+2)}if(r+2<ROWS&&b[r+1][c]===k&&b[r+2][c]===k){found.add(r*COLS+c);found.add((r+1)*COLS+c);found.add((r+2)*COLS+c)}}return found}
function newBoard(){board=Array.from({length:ROWS},()=>Array.from({length:COLS},()=>rnd(4)));for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){while((c>1&&board[r][c]===board[r][c-1]&&board[r][c]===board[r][c-2])||(r>1&&board[r][c]===board[r-1][c]&&board[r][c]===board[r-2][c]))board[r][c]=(board[r][c]+1)%4;}board[4][1]=0;board[4][2]=0;board[4][3]=1;board[4][4]=0;}
function reset(){newBoard();paint=mask.map(r=>r.map(()=>false));ship={x:210,y:470};enemies=[];shots=[];drops=[];particles=[];enemyShots=[];score=0;hp=5;ink=[];time=0;spawn=1;fireCD=0;bombCD=0;chain=0;chainUntil=0;summon=0;invuln=0;winCount=0;mode='swap';shake=0;clearInput();ui();}
function clearInput(){keys.clear();firePointers.clear();fireKey=false;padDrag=null;drag=null;$('fire').classList.remove('held')}
function target(){return {c:Math.max(0,Math.min(COLS-2,Math.round((ship.x-GX-S/2)/S))),r:Math.max(0,Math.min(ROWS-1,Math.round((ship.y-150-GY-S/2)/S)))}}
function burst(x,y,col,n=12){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,life:.4+Math.random()*.4,col})}
function ui(){const done=paint.flat().filter(Boolean).length;$('score').textContent='SCORE '+score;$('progress').textContent='ナス '+done+' / '+total;$('life').textContent='♥'.repeat(hp);$('mode').textContent=mode==='swap'?'B：交換':'B：素材を置く';$('bLabel').textContent=mode==='swap'?'照準の2マスを交換':ink.length?'素材 '+['◆','●','▲','■'][ink[0]]+' ×'+ink.length:'素材なし（Aで獲得）';}
let messageUntil=0;function message(s,secs=3){$('hint').textContent=s;messageUntil=time+secs}
function activateSummon(demo=false){summon=3.4;shake=14;winCount++;score+=demo?0:1500;for(const e of enemies)burst(e.x,e.y,'#d9a5ff',18);enemies=[];enemyShots=[];paint=mask.map(r=>r.map(()=>true));tone(130,.6,'sawtooth',.07);message(demo?'召喚プレビュー：ナスの地上絵が実体になる！':'完成！ 地上絵から巨大ナス召喚！ +1500',4);ui();}
function resolve(){let hit=matches();if(!hit.size)return false;chain=time<chainUntil?chain+1:1;chainUntil=time+3.2;score+=hit.size*30*chain;for(const id of hit){let r=Math.floor(id/COLS),c=id%COLS;burst(GX+c*S+24,GY+r*S+24,colors[board[r][c]],8);board[r][c]=-1;if(mask[r][c])paint[r][c]=true;}
// Immediate refill keeps this first study focused on aim and placement; cascade is resolved on later B inputs.
for(let c=0;c<COLS;c++){const remain=board.map(r=>r[c]).filter(v=>v>=0);while(remain.length<ROWS)remain.unshift(rnd(4));for(let r=0;r<ROWS;r++)board[r][c]=remain[r]}
tone(220*Math.pow(1.25,Math.min(chain,7)),.2,'triangle');message(chain+' CHAIN — 光が消える前に次をそろえる！');
if(paint.flat().filter(Boolean).length===total)activateSummon();ui();return true;}
function bomb(){if(phase!=='play'||bombCD>0||summon>0)return;const {r,c}=target();if(mode==='place'){if(!ink.length){message('素材は空中の光る菱形。自機で近づいて回収');return}board[r][c]=ink.shift()}else{[board[r][c],board[r][c+1]]=[board[r][c+1],board[r][c]]}bombCD=.2;tone(330,.09,'triangle');burst(GX+c*S+24,GY+r*S+24,'#ffffff',6);if(!resolve())message(mode==='swap'?'交換しました。同じ色・形を縦横3つそろえる':'素材を配置しました');ui();}
function kill(e){e.dead=true;score+=100;burst(e.x,e.y,'#ffbc89');drops.push({x:e.x,y:e.y,k:e.k,age:0});tone(100,.08,'square');ui()}
function damage(){if(invuln>0)return;hp--;invuln=1.6;shake=7;tone(75,.15,'sawtooth');ui();if(hp<=0){phase='over';clearInput();$('overlay').classList.remove('hidden');$('overlay').innerHTML='<div><h2>もう一度、描こう。</h2><p>SCORE '+score+' ／ 召喚 '+winCount+'回<br>地上を狙う間もAは押し続けられます。</p><button onclick="restart()">もう一度あそぶ</button></div>'}}
function update(dt){time+=dt;spawn-=dt;fireCD-=dt;bombCD-=dt;invuln-=dt;shake=Math.max(0,shake-dt*25);
let dx=(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0),dy=(keys.has('ArrowDown')||keys.has('s')?1:0)-(keys.has('ArrowUp')||keys.has('w')?1:0);
if(padDrag){dx=padDrag.dx;dy=padDrag.dy}ship.x=Math.max(25,Math.min(W-25,ship.x+dx*230*dt));ship.y=Math.max(264,Math.min(590,ship.y+dy*230*dt));
if((firePointers.size||fireKey)&&fireCD<=0){shots.push({x:ship.x,y:ship.y-20});fireCD=.12;tone(620,.035,'triangle',.016)}
if(spawn<=0&&summon<=0){const k=rnd(4);for(let i=0;i<3;i++)enemies.push({x:65+i*140,y:-30-i*24,t:Math.random()*6,k,hp:2,age:0});spawn=3.2}
for(const s of shots){s.y-=620*dt;for(const e of enemies)if(!e.dead&&Math.hypot(s.x-e.x,s.y-e.y)<22){s.y=-99;if(--e.hp<=0)kill(e);break}}shots=shots.filter(s=>s.y>-30);
for(const e of enemies){e.age+=dt;e.y+=43*dt;e.x+=Math.sin(e.age*2+e.t)*28*dt;if(e.age>2.8){e.age=0;enemyShots.push({x:e.x,y:e.y})}if(Math.hypot(e.x-ship.x,e.y-ship.y)<27){e.dead=true;damage()}}enemies=enemies.filter(e=>!e.dead&&e.y<H+40);
for(const s of enemyShots){s.y+=130*dt;if(Math.hypot(s.x-ship.x,s.y-ship.y)<15){s.y=999;damage()}}enemyShots=enemyShots.filter(s=>s.y<H+30);
for(const d of drops){d.age+=dt;d.y+=18*dt;if(Math.hypot(d.x-ship.x,d.y-ship.y)<45){if(ink.length<8){ink.push(d.k);message('素材を回収！ 下の「B：交換」で配置モードに切替');tone(880,.14)}else{score+=50}d.dead=true;ui()}}drops=drops.filter(d=>!d.dead&&d.y<H+20);
for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt}particles=particles.filter(p=>p.life>0);
if(summon>0){summon-=dt;if(summon<=0){paint=mask.map(r=>r.map(()=>false));ui();message('次の地上絵へ。何度でも召喚できます。')}}
if(time>messageUntil){$('hint').textContent=time<chainUntil?'連鎖チャンス '+(chainUntil-time).toFixed(1)+'秒':'移動で地上照準を合わせ、Bで交換。薄いナスのマスを消そう。'}
}
function symbol(k,x,y,size=8){ctx.beginPath();if(k===0){ctx.moveTo(x,y-size);ctx.lineTo(x+size,y);ctx.lineTo(x,y+size);ctx.lineTo(x-size,y)}else if(k===1){ctx.arc(x,y,size,0,Math.PI*2)}else if(k===2){ctx.moveTo(x,y-size);ctx.lineTo(x+size,y+size);ctx.lineTo(x-size,y+size)}else{ctx.rect(x-size,y-size,size*2,size*2)}ctx.closePath();ctx.fill()}
function eggplant(x,y,scale,alpha=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.globalAlpha=alpha;ctx.rotate(.3);let gr=ctx.createLinearGradient(-35,0,45,0);gr.addColorStop(0,'#562087');gr.addColorStop(.5,'#bb72f6');gr.addColorStop(1,'#6733b2');ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(6,-63);ctx.bezierCurveTo(23,-23,67,-16,45,49);ctx.bezierCurveTo(23,92,-45,78,-41,35);ctx.bezierCurveTo(-37,3,-9,-18,6,-63);ctx.fill();ctx.fillStyle='#9bdd6c';ctx.beginPath();ctx.moveTo(6,-71);ctx.lineTo(25,-41);ctx.lineTo(5,-47);ctx.lineTo(-12,-34);ctx.lineTo(-8,-55);ctx.lineTo(-23,-51);ctx.closePath();ctx.fill();ctx.strokeStyle='#bdf790';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(5,-62);ctx.quadraticCurveTo(0,-83,15,-91);ctx.stroke();ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);ctx.fillStyle='#0b262e';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#183941';ctx.lineWidth=1;for(let y=-40;y<H;y+=42){ctx.beginPath();ctx.moveTo(0,y+(time*10)%42);ctx.lineTo(W,y+(time*10)%42);ctx.stroke()}
ctx.font='11px system-ui';ctx.fillStyle='#70968e';ctx.fillText('GROUND / ナスの地上絵',GX,76);ctx.fillText('AIR / 編隊を撃って素材を回収',GX,26);
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){let x=GX+c*S,y=GY+r*S,k=board[r][c];ctx.fillStyle=paint[r][c]?'#7d439d':mask[r][c]?'#484456':'#122f38';ctx.fillRect(x+1,y+1,S-2,S-2);if(mask[r][c]){ctx.strokeStyle=paint[r][c]?'#e5baff':'#86778f';ctx.strokeRect(x+3,y+3,S-6,S-6)}ctx.globalAlpha=paint[r][c]?.45:.9;ctx.fillStyle=colors[k];symbol(k,x+24,y+24,10);ctx.globalAlpha=1;if(paint[r][c]){ctx.fillStyle='#ead3ff';ctx.fillRect(x+6,y+5,5,5)}}
const {r,c}=target(),tx=GX+c*S,ty=GY+r*S;ctx.strokeStyle='#f6f5b4';ctx.lineWidth=3;ctx.strokeRect(tx+2,ty+2,S*(mode==='swap'?2:1)-4,S-4);ctx.setLineDash([3,7]);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(ship.x,ship.y);ctx.lineTo(tx+24,ty+24);ctx.stroke();ctx.setLineDash([]);
for(const d of drops){ctx.save();ctx.translate(d.x,d.y);ctx.rotate(time);ctx.strokeStyle=colors[d.k];ctx.strokeRect(-13,-13,26,26);ctx.restore();ctx.fillStyle=colors[d.k];symbol(d.k,d.x,d.y,7)}
for(const s of shots){ctx.fillStyle='#e9ffb3';ctx.shadowColor='#bbff6b';ctx.shadowBlur=8;ctx.fillRect(s.x-2,s.y-12,4,17);ctx.shadowBlur=0}
for(const e of enemies){ctx.save();ctx.translate(e.x,e.y);ctx.fillStyle='#031019';ctx.beginPath();ctx.ellipse(5,12,22,10,0,0,7);ctx.fill();ctx.fillStyle=colors[e.k];ctx.beginPath();ctx.moveTo(0,19);ctx.lineTo(-20,-6);ctx.lineTo(-8,-2);ctx.lineTo(0,-15);ctx.lineTo(8,-2);ctx.lineTo(20,-6);ctx.closePath();ctx.fill();ctx.fillStyle='#152a37';ctx.fillRect(-4,-5,8,12);ctx.restore()}
for(const s of enemyShots){ctx.fillStyle='#ff8d70';ctx.beginPath();ctx.arc(s.x,s.y,5,0,7);ctx.fill()}
ctx.save();ctx.translate(ship.x,ship.y);ctx.globalAlpha=invuln>0?.5+.5*Math.sin(time*35):1;ctx.fillStyle='#090f24';ctx.beginPath();ctx.ellipse(8,20,24,10,0,0,7);ctx.fill();ctx.fillStyle='#f5f4d8';ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(19,17);ctx.lineTo(0,8);ctx.lineTo(-19,17);ctx.closePath();ctx.fill();ctx.fillStyle='#66d4e3';ctx.fillRect(-4,-5,8,16);ctx.fillStyle='#e8b677';ctx.fillRect(-3,16,6,8+Math.random()*8);ctx.restore();
for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.col;ctx.fillRect(p.x-2,p.y-2,4,4)}ctx.globalAlpha=1;
if(summon>0){const elapsed=3.4-summon;ctx.fillStyle='#ac70da22';ctx.fillRect(0,0,W,H);eggplant(210,350-elapsed*125,Math.min(2.6,.8+elapsed*2));ctx.textAlign='center';ctx.fillStyle='#fff1d0';ctx.font='bold 29px system-ui';ctx.fillText('ナス、顕現。',210,510);ctx.font='13px system-ui';ctx.fillText('描いたものが、力になる。',210,538);ctx.textAlign='left'}
if(time<chainUntil){ctx.fillStyle='#bce7a0';ctx.fillRect(GX,446,(COLS*S)*(chainUntil-time)/3.2,3)}ctx.restore()}
function point(e){const b=canvas.getBoundingClientRect();return{x:(e.clientX-b.left)/b.width*W,y:(e.clientY-b.top)/b.height*H}}
canvas.addEventListener('pointerdown',e=>{if(phase!=='play'||drag)return;canvas.setPointerCapture(e.pointerId);drag={id:e.pointerId,p:point(e)}});canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const p=point(e);ship.x=Math.max(25,Math.min(W-25,ship.x+p.x-drag.p.x));ship.y=Math.max(264,Math.min(590,ship.y+p.y-drag.p.y));drag.p=p});
for(const ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,e=>{if(drag?.id===e.pointerId)drag=null});
$('pad').addEventListener('pointerdown',e=>{if(phase!=='play'||padDrag)return;$('pad').setPointerCapture(e.pointerId);padDrag={id:e.pointerId,x:e.clientX,y:e.clientY,dx:0,dy:0}});$('pad').addEventListener('pointermove',e=>{if(padDrag?.id!==e.pointerId)return;padDrag.dx=Math.max(-1,Math.min(1,(e.clientX-padDrag.x)/35));padDrag.dy=Math.max(-1,Math.min(1,(e.clientY-padDrag.y)/35))});for(const ev of ['pointerup','pointercancel','lostpointercapture'])$('pad').addEventListener(ev,e=>{if(padDrag?.id===e.pointerId)padDrag=null});
$('fire').addEventListener('pointerdown',e=>{if(phase!=='play')return;audio();$('fire').setPointerCapture(e.pointerId);firePointers.add(e.pointerId);$('fire').classList.add('held')});for(const ev of ['pointerup','pointercancel','lostpointercapture'])$('fire').addEventListener(ev,e=>{firePointers.delete(e.pointerId);if(!firePointers.size)$('fire').classList.remove('held')});$('bomb').addEventListener('pointerdown',e=>{e.preventDefault();audio();bomb()});
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','z','x'].includes(e.key))e.preventDefault();keys.add(e.key);if(e.key===' '||e.key==='z')fireKey=true;if(e.key==='x'&&!e.repeat)bomb()});window.addEventListener('keyup',e=>{keys.delete(e.key);if(e.key===' '||e.key==='z')fireKey=false});
function togglePause(){if(phase==='play'){phase='pause';clearInput();$('pause').textContent='再開';message('一時停止中')}else if(phase==='pause'){phase='play';$('pause').textContent='一時停止'}}
window.addEventListener('blur',()=>{clearInput();if(phase==='play')togglePause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&phase==='play')togglePause()});
function restart(){audio();reset();phase='play';$('overlay').classList.add('hidden');$('pause').textContent='一時停止';message('まず地上のナスの薄いマスへ照準を。Bで左右交換。',5)}
$('start').onclick=restart;$('reset').onclick=restart;$('pause').onclick=togglePause;$('sound').onclick=()=>{sound=!sound;$('sound').textContent='音 '+(sound?'ON':'OFF');if(sound)audio()};$('mode').onclick=()=>{mode=mode==='swap'?'place':'swap';ui()};$('demo').onclick=()=>{if(phase==='play'){activateSummon(true)}};
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0)}window.addEventListener('resize',resize);resize();reset();let last=performance.now();function frame(now){const dt=Math.min((now-last)/1000,.04);last=now;if(phase==='play')update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
